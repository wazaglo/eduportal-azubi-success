name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  REGION: eu-west-1
  ROLE_ARN: arn:aws:iam::814330181503:role/eduportal-lambda-role
  RUNTIME: nodejs20.x
  MEMORY: 256
  TIMEOUT_DEFAULT: 30
  TIMEOUT_LONG: 60

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build handlers
        run: npm run build

      - name: Package deployment zips
        run: npm run package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Deploy all Lambda functions
        run: |
          shopt -s globstar

          for zip in deployments/**/*.zip; do
            handler_path="${zip#deployments/}"
            handler_path="${handler_path%.zip}"
            function_name="eduportal-${handler_path////-}"
            timeout=$TIMEOUT_DEFAULT
            [ "$handler_path" = "chat/send-message" ] && timeout=$TIMEOUT_LONG
            [ "$handler_path" = "ai/process-async" ] && timeout=$TIMEOUT_LONG

            echo "Deploying ${function_name} (${handler_path}.main, ${timeout}s)..."

            if aws lambda get-function --function-name "$function_name" --region "$REGION" &>/dev/null; then
              # Update config first (fast), then code (slow) to avoid conflict
              aws lambda update-function-configuration \
                --function-name "$function_name" \
                --handler "${handler_path}.main" \
                --timeout "$timeout" \
                --memory-size "$MEMORY" \
                --region "$REGION" > /dev/null

              aws lambda update-function-code \
                --function-name "$function_name" \
                --zip-file "fileb://${zip}" \
                --region "$REGION"
            else
              aws lambda create-function \
                --function-name "$function_name" \
                --runtime "$RUNTIME" \
                --role "$ROLE_ARN" \
                --handler "${handler_path}.main" \
                --zip-file "fileb://${zip}" \
                --timeout "$timeout" \
                --memory-size "$MEMORY" \
                --region "$REGION" > /dev/null
            fi

            echo "  ✓ ${function_name}"
          done

          echo ""
          echo "All functions deployed."
