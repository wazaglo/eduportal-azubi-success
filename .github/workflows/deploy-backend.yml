name: Deploy Backend

on:
  push:
    branches: [dev, main]
    paths:
      - 'backend/**'

env:
  REGION: ${{ secrets.AWS_REGION }}
  ROLE_ARN: ${{ secrets.LAMBDA_ROLE_ARN }}
  RUNTIME: nodejs20.x
  MEMORY: 256
  TIMEOUT_DEFAULT: 30
  TIMEOUT_LONG: 60

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build handlers
        run: npm run build

      - name: Package deployment zips
        run: npm run package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy all Lambda functions
        run: |
          shopt -s globstar

          # Common env vars for every function (skip empty/unset secrets)
          COMMON_VARS=""
          env_append() {
            local var="$1" val="$2"
            [ -z "$val" ] && return
            [ -n "$COMMON_VARS" ] && COMMON_VARS="$COMMON_VARS,"
            COMMON_VARS="${COMMON_VARS}${var}=${val}"
          }
          env_append TABLE_USERS "${{ secrets.TABLE_USERS }}"
          env_append TABLE_CONVERSATIONS "${{ secrets.TABLE_CONVERSATIONS }}"
          env_append TABLE_MESSAGES "${{ secrets.TABLE_MESSAGES }}"
          env_append TABLE_CACHE "${{ secrets.TABLE_CACHE }}"
          env_append TABLE_FEEDBACK "${{ secrets.TABLE_FEEDBACK }}"
          env_append TABLE_ANALYTICS "${{ secrets.TABLE_ANALYTICS }}"
          env_append TABLE_AUDIT_LOG "${{ secrets.TABLE_AUDIT_LOG }}"
          env_append JWT_SECRET "${{ secrets.JWT_SECRET }}"
          env_append JWT_ISSUER "${{ secrets.JWT_ISSUER }}"

          for zip in deployments/**/*.zip; do
            handler_path="${zip#deployments/}"
            handler_path="${handler_path%.zip}"
            function_name="eduportal-${handler_path////-}"

            ENV_VARS="${COMMON_VARS}"
            TIMEOUT=$TIMEOUT_DEFAULT

            env_append_to() {
              local var="$1" val="$2"
              [ -z "$val" ] && return
              [ -n "$ENV_VARS" ] && ENV_VARS="$ENV_VARS,"
              ENV_VARS="${ENV_VARS}${var}=${val}"
            }

            case "$handler_path" in
              chat/send-message)
                env_append_to ASYNC_QUEUE_URL "${{ secrets.ASYNC_QUEUE_URL }}"
                env_append_to KNOWLEDGE_BUCKET "${{ secrets.KNOWLEDGE_BUCKET }}"
                env_append_to AI_MODEL_ID "${{ secrets.AI_MODEL_ID }}"
                TIMEOUT=$TIMEOUT_LONG
                ;;
              ai/process-async)
                env_append_to AI_MODEL_ID "${{ secrets.AI_MODEL_ID }}"
                TIMEOUT=$TIMEOUT_LONG
                ;;
            esac

            echo "Deploying ${function_name} (${handler_path}.main, ${TIMEOUT}s)..."

            # Build env flag (skip if no vars to prevent clearing existing ones)
            ENV_FLAG=""
            [ -n "$ENV_VARS" ] && ENV_FLAG="--environment Variables={${ENV_VARS}}"

            if aws lambda get-function --function-name "$function_name" --region "$REGION" &>/dev/null; then
              aws lambda update-function-code \
                --function-name "$function_name" \
                --zip-file "fileb://${zip}" \
                --region "$REGION"

              aws lambda update-function-configuration \
                --function-name "$function_name" \
                --handler "${handler_path}.main" \
                --timeout "$TIMEOUT" \
                --memory-size "$MEMORY" \
                $ENV_FLAG \
                --region "$REGION" > /dev/null
            else
              aws lambda create-function \
                --function-name "$function_name" \
                --runtime "$RUNTIME" \
                --role "$ROLE_ARN" \
                --handler "${handler_path}.main" \
                --zip-file "fileb://${zip}" \
                --timeout "$TIMEOUT" \
                --memory-size "$MEMORY" \
                $ENV_FLAG \
                --region "$REGION" > /dev/null
            fi

            echo "  ✓ ${function_name}"
          done

          echo ""
          echo "All functions deployed."
