name: Deploy Frontend

on:
  push:
    branches: [main, staging]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

env:
  NODE_VERSION: "20"

concurrency:
  group: deploy-frontend-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    outputs:
      bundle-hash: ${{ steps.hash.outputs.hash }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Hash build output
        id: hash
        run: |
          HASH=$(find dist -type f -exec md5sum {} + | md5sum | cut -d' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-bundles-${{ github.sha }}
          path: frontend/dist/
          retention-days: 7

  deploy:
    name: Deploy to Amplify
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-deploy-frontend

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-bundles-${{ github.sha }}
          path: dist/

      - name: Deploy to Amplify
        run: |
          APP_ID="${{ secrets.AMPLIFY_APP_ID }}"
          ENV_NAME="${{ github.ref_name == 'main' && 'production' || 'staging' }}"

          aws amplify start-deployment \
            --app-id "$APP_ID" \
            --branch-name "$ENV_NAME" \
            --job-type "RELEASE" || true

          aws amplify create-deployment \
            --app-id "$APP_ID" \
            --branch-name "$ENV_NAME" \
            --job-type "RELEASE" \
            --summary "GitHub Actions deploy ${{ github.sha }}" > deployment.json

          JOB_ID=$(cat deployment.json | jq -r '.jobId')

          for file in dist/**/*; do
            if [ -f "$file" ]; then
              relative_path="${file#dist/}"
              aws amplify upload-artifact \
                --job-id "$JOB_ID" \
                --file-name "$relative_path" \
                --content-type "application/octet-stream" \
                "$file"
            fi
          done

          aws amplify complete-deployment \
            --app-id "$APP_ID" \
            --branch-name "$ENV_NAME" \
            --job-id "$JOB_ID"

          echo "Deployment complete for $ENV_NAME"